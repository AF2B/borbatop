[package]
name = "borbatop-sources"
description = "Linux data sources for borbatop: procfs, sysfs, cgroup v2 and systemctl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
borbatop-core.workspace = true
rustix = { version = "1.1.6", features = ["process", "param", "fs"] }

[lints]
workspace = true

[[bench]]
name = "collect"
harness = false

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
