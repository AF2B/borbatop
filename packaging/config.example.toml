# borbatop configuration: copy to ~/.config/borbatop/config.toml
# Every key is optional; unknown keys are rejected. Command-line flags win over this file.

# Time between samples, in milliseconds (200 to 10000).
interval_ms = 1000

# "borba" (24-bit color) or "ansi" (the terminal's own 16 colors).
theme = "borba"

# Start with processes arranged as a tree (same as `t` on the screen).
tree = false

# Show the column that names the package owning each executable.
show_package = true

# Samples kept for sparklines (8 to 600).
history = 60

# Levels from which a reading raises an alert in the header.
[alerts]
# Machine-wide CPU usage, in percent (1 to 100).
cpu_percent = 90
# Share of memory in use, in percent (1 to 100).
memory_percent = 90
# Share of swap in use, in percent (1 to 100).
swap_percent = 90
# Share of the last 10 seconds some task stalled on CPU, memory or I/O (PSI), in percent.
pressure_percent = 20
# CPU temperature, in degrees Celsius (30 to 120).
temperature_celsius = 85
