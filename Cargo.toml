[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["André Borba"]

[workspace.dependencies]
borbatop-core = { path = "crates/borbatop-core" }
borbatop-sources = { path = "crates/borbatop-sources" }
borbatop-tui = { path = "crates/borbatop-tui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
wildcard_enum_match_arm = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
